<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>sayings.txt</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Out of context Torchbox" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#030712" data-js-theme-color-meta />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; base-uri 'self'; form-action 'self'"
    />
    <script src="./js/theme-init.js"></script>
    <link rel="canonical" href="https://siimonevans.github.io/sayings/" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23030712'/><text x='50' y='71' font-size='62' text-anchor='middle' fill='%236c9bff' font-family='Georgia,serif'>&#8221;</text></svg>"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="sayings.txt" />
    <meta property="og:title" content="sayings.txt" />
    <meta property="og:description" content="Out of context Torchbox" />
    <meta property="og:url" content="https://siimonevans.github.io/sayings/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="sayings.txt" />
    <meta name="twitter:description" content="Out of context Torchbox" />

    <link rel="stylesheet" type="text/css" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1>sayings.txt</h1>
        <div class="topbar-controls">
          <a
            class="icon-button"
            href="mailto:simon.evans@torchbox.com?subject=Saying%20suggestion&body=Author%3A%20%0ASaying%3A%20"
            aria-label="Suggest a saying by email"
            data-tooltip="Submit a saying"
            ><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 2v12M2 8h12"/></svg
          ></a>
          <button
            class="icon-button"
            data-js-theme-toggle
            type="button"
            aria-label="Switch to light mode"
            data-tooltip="Light mode"
          ></button>
          <a
            class="icon-button"
            href="https://github.com/siimonevans/sayings"
            target="_blank"
            rel="noopener"
            aria-label="View source on GitHub (opens in a new tab)"
            data-tooltip="GitHub"
            ><svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg
          ></a>
        </div>
      </header>

      <main class="main">
        <div class="quote-nav">
          <button
            class="icon-button icon-button-small"
            data-js-history-back
            type="button"
            aria-label="Go back to the previous saying"
            data-tooltip="Back"
            disabled
          >&#8592;</button>
          <button
            class="icon-button icon-button-small"
            data-js-history-forward
            type="button"
            aria-label="Go forward to the next saying"
            data-tooltip="Forward"
            disabled
          >&#8594;</button>
        </div>

        <div class="search">
          <label class="visually-hidden" for="search-input"
            >Search sayings by author or text</label
          >
          <input
            type="search"
            class="search-input"
            id="search-input"
            data-js-search-input
            placeholder="Search by author or saying"
            autocomplete="off"
          />
          <button
            type="button"
            class="search-clear is-hidden"
            data-js-search-clear
            aria-label="Clear search"
          ><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"/></svg></button>
          <p class="visually-hidden" data-js-search-status role="status"></p>
        </div>

        <div class="stage-wrapper">
          <button class="stage" data-js-stage type="button" aria-label="Show a new saying">
            <div class="author" data-js-author role="status"></div>
            <div class="quote" data-js-quote role="status"></div>
          </button>
          <button
            class="icon-button card-share-button"
            data-js-share-button
            type="button"
            aria-label="Copy a link to this saying"
            data-tooltip="Copy link"
          ></button>
          <p class="visually-hidden" data-js-copy-status role="status"></p>
        </div>

        <p class="hint">
          <span class="u-desktop-only"><span class="hint-emphasis">Click</span> or press <span class="hint-emphasis">spacebar</span> for more</span>
          <span class="u-mobile-only"><span class="hint-emphasis">Tap</span> or <span class="hint-emphasis">swipe</span> for more</span>
        </p>

        <ul class="results is-hidden" data-js-results></ul>
      </main>
    </div>

    <script src="./sayings.js"></script>
    <script src="./js/quoteDeck.js"></script>
    <script src="./js/search.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
